# render.yaml
services:
  - type: web
    name: my-ticketing-app
    runtime: node
    plan: free
    
    buildCommand: |
     npm install
     npx prisma generate
     npx prisma migrate deploy
     npm run build



    
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: DATABASE_URL
        fromDatabase:
          name: ticketing-db
          property: connectionString
      - key: NEXT_PUBLIC_BASE_URL
        value: https://my-ticketing-app.onrender.com
      - key: NEXT_RUNTIME
        value: nodejs # Important for SSR and API routes
    disk:
      name: vercel-postgres-data
      mountPath: /var/lib/postgresql/data

databases:
  - name: ticketing-db
    plan: free